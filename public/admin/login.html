<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — gene-carlo.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #111118;
      --bg-elevated: #16161f;
      --border: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 1.5rem;
    }

    .login-logo {
      font-family: 'Geist Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-align: center;
    }
    .login-logo span { color: var(--accent); }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-family: 'Geist Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-family: 'Geist Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .field input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.875rem;
      font-family: 'Geist', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); }

    .error-msg {
      font-family: 'Geist Mono', monospace;
      font-size: 0.72rem;
      color: var(--red);
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.show { display: block; }

    .btn-login {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 0.7rem;
      font-family: 'Geist Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: white;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { opacity: 0.85; }
    .btn-login:active { opacity: 0.7; }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: 'Geist Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">GC / <span>System Admin</span></div>
  <div class="login-card">
    <h1 class="login-title">Sign in</h1>
    <p class="login-sub">gene-carlo.com · restricted access</p>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
    </div>

    <div class="error-msg" id="error-msg">Incorrect username or password.</div>

    <button class="btn-login" onclick="doLogin()">Sign In →</button>
  </div>
  <div class="login-footer">gene-carlo.com · admin panel</div>
</div>

<script>
  // If already logged in, skip login page
  if (sessionStorage.getItem('gc_admin_auth') === '1') {
    window.location.href = 'index.html';
  }

  function doLogin() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    if (user === 'Gene Carlo' && pass === '3236') {
      sessionStorage.setItem('gc_admin_auth', '1');
      window.location.href = 'index.html';
    } else {
      document.getElementById('error-msg').classList.add('show');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
